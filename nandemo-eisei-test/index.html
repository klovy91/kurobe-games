function bounce(a,c,dx,dy,d){var nx=dx/d,ny=dy/d,rvx=c.vx-a.vx,rvy=c.vy-a.vy,vn=rvx*nx+rvy*ny,vt=-rvx*ny+rvy*nx,ov=a.s+c.s-d,M=a.m+c.m;
 a.x-=nx*ov*c.m/M;a.y-=ny*ov*c.m/M;c.x+=nx*ov*a.m/M;c.y+=ny*ov*a.m/M;
 if(vn<0){var j=-1.6*vn/(1/a.m+1/c.m);a.vx-=j/a.m*nx;a.vy-=j/a.m*ny;c.vx+=j/c.m*nx;c.vy+=j/c.m*ny}

function step(h){var n=bodies.length,i,b;
 for(i=0;i<n;i++){b=bodies[i];if(!b.alive)continue;var r;
  if(b.ph){fstep(b,h);b.fs++;if(b.ph===4)burnout(b);
   else if(b.ph===2&&!b.waited&&b.RT<RFAR&&state==='play'){var rr=Math.hypot(b.x,b.y);if((b.vx*b.x+b.vy*b.y)/rr<=.25*Math.sqrt(MU/b.RT))enterWait(b)}}
  else{r=Math.hypot(b.x,b.y);var k=-MU/(r*r*r);b.vx+=k*b.x*h;b.vy+=k*b.y*h;b.x+=b.vx*h;b.y+=b.vy*h}
  if(b.leaving)continue;r=Math.hypot(b.x,b.y);
  if(r<R+b.s*.6&&!(b.ph&&b.fs<24)){crash(b);continue}
  if(r>RFAR||(r>RMAX&&(b.vx*b.vx+b.vy*b.vy)/2-MU/r>=0&&b.x*b.vx+b.y*b.vy>0))escape(b)}
 for(i=0;i<n;i++){var a=bodies[i];if(!a.alive||a.leaving)continue;
  for(var j=i+1;j<n;j++){var c=bodies[j];if(!c.alive||c.leaving)continue;var dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);
   var res=state==='play'?RECIPE[key(a.type,c.type)]:null;
   if(res&&d<(a.s+c.s)*MRG){merge(a,c,res);break}                      /* merging reaches further than bouncing */
   if(!res&&d<a.s+c.s&&d>1e-6&&!(a.cool[c.id]>0))bounce(a,c,dx,dy,d)}}}
