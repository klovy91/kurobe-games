 var t=AC.currentTime+(dl||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;s.loop=true;f.type='lowpass';f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03)}

function crash(b){kill(b);SFX.boom();shk=.12;flash=.35;flEl.style.background='#ff5a3a';
 burst(b.x,b.y,46,['#ffe27a','#ff8a3a','#ff3b3b','#ffffff'],2.2,.9,.12);ring(b.x,b.y,0xff7a3a,.6,.5);label(b.x,b.y,'墜落!','bad big',1.3,-20);loseLife()}

function merge(a,c,res){var M=a.m+c.m,x=(a.x*a.m+c.x*c.m)/M,y=(a.y*a.m+c.y*c.m)/M;kill(a);kill(c);
 var s=SIZE[ITEM[res].t],r=Math.hypot(x,y),rmin=R+s*.9;if(r<rmin){x*=rmin/r;y*=rmin/r;r=rmin}
 var v=Math.sqrt(MU/r),nb=mkBody(res,x,y,-y/r*v,x/r*v);nb.pop=0;nb.lf=1;
 merges++;combo=comboT>0?combo+1:1;comboT=4;var t=ITEM[res].t,pts=[0,0,500,1200,3000][t]*combo,isNew=dex.indexOf(res)<0;
 if(isNew){dex.push(res);ss('ne_dex',dex);pts+=1000}if(found.indexOf(res)<0)found.push(res);
 addScore(pts);SFX.merge(combo);slow(.25,.55);flash=.3;flEl.style.background='#fff';shk=.04;

 label(x,y,img(res)+ITEM[res].n+'!','big'+(isNew?' new':''),1.7,-30);

 if(isNew)msg('NEW!','#ffe27a');hints()}
function bounce(a,c,dx,dy,d){var nx=dx/d,ny=dy/d,vn=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny,ov=a.s+c.s-d;
 var M=a.m+c.m;a.x-=nx*ov*c.m/M;a.y-=ny*ov*c.m/M;c.x+=nx*ov*a.m/M;c.y+=ny*ov*a.m/M;
 if(vn<0){var j=-(1.6)*vn/(1/a.m+1/c.m);a.vx-=j/a.m*nx;a.vy-=j/a.m*ny;c.vx+=j/c.m*nx;c.vy+=j/c.m*ny}
 reorbit(a);reorbit(c);a.cool[c.id]=c.cool[a.id]=.25;
 if(state!=='title'){SFX.tok();burst((a.x+c.x)/2,(a.y+c.y)/2,8,['#ffffff','#aac4ff'],.8,.3,.05)}}
function step(h){var n=bodies.length,i,b;
 for(i=0;i<n;i++){b=bodies[i];if(!b.alive)continue;var r2=b.x*b.x+b.y*b.y,r=Math.sqrt(r2),k=-MU/(r2*r);
  b.vx+=k*b.x*h*.5;b.vy+=k*b.y*h*.5;b.x+=b.vx*h;b.y+=b.vy*h;r2=b.x*b.x+b.y*b.y;r=Math.sqrt(r2);k=-MU/(r2*r);b.vx+=k*b.x*h*.5;b.vy+=k*b.y*h*.5;
  if(b.leaving)continue;

  if(r>RMAX){escape(b)}}
 for(i=0;i<n;i++){var a=bodies[i];if(!a.alive||a.leaving)continue;
  for(var j=i+1;j<n;j++){var c=bodies[j];if(!c.alive||c.leaving)continue;var dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);

/* ---------- main loop ---------- */
var last=performance.now(),T=0;

function loop(now){requestAnimationFrame(loop);var dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;T+=dt;

  if(!pad.ready){pad.t+=dt;if(pad.t>.45)loadPad()}
  else if(pad.sp){pad.t+=dt;var f=Math.min(1,pad.t*4),s=SIZE[ITEM[pad.type].t]*SPR*(f<1?easeBack(f):1)*(charging?1+g*.15:1);pad.sp.scale.setScalar(s);
   pad.sp.position.set(R0+(charging?(Math.random()-.5)*.02*g:0),0,charging?(Math.random()-.5)*.02*g:0)}
  if(charging){g+=dt/FILL;var k=K0+(K1-K0)*Math.min(g,1),o=orbit(R0,0,0,k*VC,SIZE[ITEM[pad.type].t]);setLine(predLine,o.pts);
   predLine.material.color.set(o.crash||o.esc?0xff5a6e:o.e<.06?0xffe27a:0x7dffb0);giEl.style.left=(Math.min(g,1)*100)+'%';chgSet(Math.min(g,1));if(g>=1){g=1;up()}}
  gtEl.style.opacity=charging?'0':''}
 if(comboT>0)comboT-=gdt;
 var n=Math.max(1,Math.ceil(gdt/.004)),h=gdt/n;for(var i=0;i<n;i++)step(h);
 bodies.forEach(function(b){for(var id in b.cool)b.cool[id]-=gdt});
 bodies=bodies.filter(function(b){if(b.alive&&b.leaving){b.leaving+=dt;if(b.leaving>1.2)kill(b)}return b.alive});
 bodies.forEach(function(b){b.sp.position.set(b.x,0,-b.y);b.sp.material.rotation+=b.spin*gdt;
  var sc=b.s*SPR;if(b.pop<1){b.pop=Math.min(1,b.pop+dt*2.5);sc*=easeBack(b.pop)*(1+(1-b.pop)*.3)}b.sp.scale.setScalar(sc);
  if(b.leaving){b.sp.material.opacity=Math.max(0,1-b.leaving);b.ln.visible=false;b.hs.visible=false;return}
  b.hs.visible=b.hint;if(b.hint){b.hs.position.copy(b.sp.position);b.hs.scale.setScalar(b.s*4.4*(1+.12*Math.sin(T*7)));b.hs.material.opacity=.65+.35*Math.sin(T*7)}
  if(b.lf>0)b.lf-=dt*.8;b.ln.material.opacity=.18+(b.hint?.3:0)+Math.max(0,b.lf)*.7});
 for(i=0;i<parts.length;i++){var p=parts[i];if(p.l<=0)continue;p.l-=dt*ts;if(p.l<=0){p.s.visible=false;continue}
  var dm=Math.pow(.25,gdt);p.vx*=dm;p.vy*=dm;p.vz*=dm;p.s.position.x+=p.vx*gdt;p.s.position.y+=p.vy*gdt;p.s.position.z+=p.vz*gdt;var q=p.l/p.L;p.s.scale.setScalar(p.z*(.4+q*.6));p.s.material.opacity=q}
 rings.forEach(function(r){if(r.t>=1){r.m.visible=false;return}r.t+=dt/r.d;var q=Math.min(1,r.t);r.m.scale.setScalar(.15+r.max*(1-Math.pow(1-q,3)));r.m.material.opacity=(1-q)*.9});
 labels=labels.filter(function(L){L.t+=dt;if(L.t>=L.d){L.el.remove();return false}var s=scr(L.x,L.y),q=L.t/L.d;
  L.el.style.transform='translate('+(s[0])+'px,'+(s[1]+L.dy-q*44)+'px) translate(-50%,-50%) scale('+(q<.1?.6+q*4:1)+')';L.el.style.opacity=String(1-Math.pow(q,3));return true});
 if(flash>0){flash=Math.max(0,flash-dt*1.6);flEl.style.opacity=String(flash)}

 shk*=Math.pow(.02,dt);cam.position.set(camBase.x+(Math.random()-.5)*shk,camBase.y+(Math.random()-.5)*shk,camBase.z+(Math.random()-.5)*shk);cam.lookAt(camLook);
