<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  html{background:#07080f;}
  body{
    margin:0;
    min-height:100vh;
    color:#eee;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 80px;
    position:relative;
    overflow-x:hidden;
  }
  /* background: nebula glow + two layers of slowly drifting stars (CSS only) */
  .sky{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 18% 12%,rgba(120,70,255,.22),transparent 70%),
      radial-gradient(ellipse 55% 40% at 85% 30%,rgba(255,60,90,.14),transparent 70%),
      radial-gradient(ellipse 70% 50% at 50% 100%,rgba(40,140,255,.18),transparent 70%),
      #07080f;}
  .sky::before,.sky::after{content:"";position:absolute;inset:-200px 0 0 0;background-repeat:repeat;}
  .sky::before{background-image:
      radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),
      radial-gradient(1px 1px at 120px 80px,rgba(255,255,255,.8),transparent),
      radial-gradient(1.4px 1.4px at 200px 160px,#cfe0ff,transparent),
      radial-gradient(1px 1px at 60px 190px,rgba(255,255,255,.7),transparent),
      radial-gradient(1.2px 1.2px at 170px 20px,#ffe9b0,transparent);
    background-size:240px 220px;opacity:.75;animation:drift 90s linear infinite;}
  .sky::after{background-image:
      radial-gradient(2px 2px at 50px 60px,#fff,transparent),
      radial-gradient(1.6px 1.6px at 300px 250px,#bcd4ff,transparent),
      radial-gradient(1.8px 1.8px at 180px 340px,#fff,transparent);
    background-size:380px 400px;opacity:.6;animation:drift 50s linear infinite;}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(200px)}}
  @media (prefers-reduced-motion:reduce){.sky::before,.sky::after,h1,h1::after{animation:none}}

  /* ---- per-game backgrounds: shown while a card is hovered (PC) or centred on screen (phone) ---- */
  .fx{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .7s;overflow:hidden}
  .fx *{animation-play-state:paused!important}
  body[data-theme="nandemo"] .fx-nandemo,body[data-theme="zombie"] .fx-zombie{opacity:1}
  body[data-theme="nandemo"] .fx-nandemo *,body[data-theme="zombie"] .fx-zombie *{animation-play-state:running!important}
  /* なんでも衛星: a big planet rising from the bottom, satellites on orbits, a ringed planet drifting */
  .fx-nandemo{background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(40,110,255,.28),transparent 70%)}
  .np{position:absolute;left:50%;bottom:-46vmin;width:72vmin;height:72vmin;margin-left:-36vmin;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#7cc0ff,#2a62c9 45%,#0d2560 75%,#06102c);box-shadow:0 0 90px rgba(80,150,255,.55),inset -18px -24px 60px rgba(0,0,30,.7)}
  .np::before{content:"";position:absolute;inset:0;border-radius:50%;background:
    radial-gradient(ellipse 18% 10% at 30% 34%,rgba(90,190,110,.9),transparent 70%),radial-gradient(ellipse 14% 9% at 62% 24%,rgba(90,190,110,.85),transparent 70%),
    radial-gradient(ellipse 22% 8% at 50% 6%,rgba(255,255,255,.8),transparent 70%);opacity:.9}
  .orb{position:absolute;left:50%;bottom:-10vmin;border:1px dashed rgba(150,190,255,.28);border-radius:50%;transform:translate(-50%,50%)}
  .orb .rot{position:absolute;inset:0;animation:spin linear infinite}
  .orb .sat{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);font-size:3.4vmin;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
  .orb .sat i{display:inline-block;font-style:normal;animation:spin linear infinite reverse}
  .rp{position:absolute;width:13vmin;height:13vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a8,#c9984a 60%,#6b4a1e);box-shadow:0 0 30px rgba(255,210,120,.35);animation:float 14s ease-in-out infinite}
  .rp::after{content:"";position:absolute;left:-45%;top:38%;width:190%;height:26%;border-radius:50%;border:2px solid rgba(255,225,170,.75);transform:rotate(-18deg)}
  .rp.p2{width:8vmin;height:8vmin;background:radial-gradient(circle at 35% 30%,#ffb8d8,#d0508e 60%,#5a1838);box-shadow:0 0 24px rgba(255,140,200,.35);animation-duration:18s}
  .rp.p2::after{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(2vmin,3vmin) rotate(8deg)}}
  /* ゾンビ一閃: red mist pulsing like a heartbeat, blood splatters on the edges, slow drips */
  .fx-zombie{background:radial-gradient(ellipse at center,transparent 38%,rgba(110,0,8,.6) 100%)}
  .zm{position:absolute;inset:-10%;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,12,.55) 100%);animation:beat 2.4s ease-in-out infinite}
  .mist{position:absolute;width:60vmax;height:30vmax;border-radius:50%;background:rgba(150,0,15,.35);filter:blur(50px);animation:mist 16s ease-in-out infinite}
  .splat{position:absolute;transform:scale(.4);opacity:0;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .3s}
  body[data-theme="zombie"] .splat{transform:scale(1);opacity:.9}
  .drip{position:absolute;width:7px;border-radius:0 0 6px 6px;background:linear-gradient(#7a0010,#a0101a);height:0;animation:drip 7s ease-in infinite}
  @keyframes beat{0%,100%{opacity:.55}12%{opacity:1}24%{opacity:.7}36%{opacity:.95}}
  @keyframes mist{0%,100%{transform:translateX(-5vmax)}50%{transform:translateX(5vmax)}}
  @keyframes drip{0%{height:0}70%{height:var(--h)}100%{height:var(--h);opacity:0}}
  @media (prefers-reduced-motion:reduce){.fx *{animation:none!important}}
  h1{
    font-family:Iceberg,sans-serif;font-weight:400;
    font-size:clamp(34px,7vw,56px);
    letter-spacing:.12em;
    margin:0 0 10px;
    text-align:center;
    position:relative;
    /* 1st layer = the moving glint, 2nd = the base colours */
    background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 45%,#ffffff 50%,rgba(255,255,255,.35) 55%,transparent 60%) no-repeat,linear-gradient(90deg,#7fb4f0,#d4dcf2 45%,#f09ab6);
    background-size:250% 100%,100% 100%;
    background-position:100% 0,0 0;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(120,170,255,.55));
    animation:shine 6s ease-in-out infinite;
  }
  /* a little star that twinkles right after the glint passes */
  h1::after{content:"✦";position:absolute;right:-.32em;top:-.18em;font-size:.42em;color:#fff;-webkit-text-fill-color:#fff;
    text-shadow:0 0 8px #fff,0 0 18px #9fd0ff;opacity:0;transform:scale(0);animation:twinkle 6s ease-in-out infinite;}
  @keyframes shine{0%,70%{background-position:100% 0,0 0;filter:drop-shadow(0 0 14px rgba(120,170,255,.55))}79%{filter:drop-shadow(0 0 22px rgba(190,215,255,.95))}88%,100%{background-position:0% 0,0 0;filter:drop-shadow(0 0 14px rgba(120,170,255,.55))}}
  @keyframes twinkle{0%,82%{opacity:0;transform:scale(0) rotate(0deg)}89%{opacity:1;transform:scale(1.25) rotate(90deg)}100%{opacity:0;transform:scale(0) rotate(180deg)}}
  .sub{
    font-family:"DotGothic16",sans-serif;
    color:#b9c4dd;
    font-size:15px;
    letter-spacing:.08em;
    margin:0 0 44px;
    text-align:center;
  }
  .grid{
    width:100%;
    max-width:960px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,340px));
    justify-content:center;
    gap:22px;
  }
  a.card{
    --ac:#8fb7ff;
    display:flex;flex-direction:column;
    text-decoration:none;
    color:#eee;
    background:rgba(18,20,30,.82);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    overflow:hidden;
    transition:transform .2s,border-color .2s,box-shadow .2s;
    -webkit-tap-highlight-color:transparent;
  }
  a.card:hover,a.card:focus-visible,a.card:active{
    transform:translateY(-4px);
    border-color:var(--ac);
    box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 22px color-mix(in srgb,var(--ac) 45%,transparent);
    outline:none;
  }
  .thumb{position:relative;aspect-ratio:1200/630;overflow:hidden;background:#000;}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s;}
  a.card:hover .thumb img,a.card:focus-visible .thumb img{transform:scale(1.06);}
  .new{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:999px;
    font:12px Iceberg,sans-serif;letter-spacing:.12em;color:#1a1300;background:#ffd84a;box-shadow:0 0 12px rgba(255,216,74,.7);}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card .title{
    font-family:"DotGothic16",sans-serif;
    font-size:22px;
    margin:0;
    color:#fff;
    text-shadow:0 0 10px color-mix(in srgb,var(--ac) 60%,transparent);
  }
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tags span{font-size:11px;padding:2px 9px;border-radius:999px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);}
  .card .desc{
    font-size:13px;
    color:#aab1c2;
    line-height:1.6;
    margin:0;
    flex:1;
  }
  .play{align-self:flex-end;font:14px Iceberg,sans-serif;letter-spacing:.12em;color:var(--ac);}
  .ad{
    width:100%;
    max-width:728px;
    min-height:50px;
    margin:56px auto 0;
    text-align:center;
    overflow:hidden;
  }
  /* スマホ：広告は画面の幅いっぱいの箱で中央に表示（切らない） */
  @media (max-width:600px){
    body{padding-top:44px;}
    .ad{width:auto;max-width:none;align-self:stretch;margin:48px -20px 0;overflow:visible;display:flex;justify-content:center;}
  }
  footer{
    margin-top:60px;
    font-size:12px;
    color:#667;
  }
</style>
</head>

  <div class="fx fx-nandemo" aria-hidden="true"><div class="rp" style="left:8vw;top:14vh"></div><div class="rp p2" style="right:10vw;top:26vh"></div><div class="np"></div></div>
  <div class="fx fx-zombie" aria-hidden="true"><div class="zm"></div><div class="mist" style="left:-20vmax;bottom:-12vmax"></div><div class="mist" style="right:-20vmax;bottom:-14vmax;animation-delay:-8s"></div></div>

  <script>
  /* per-game background: hover / keyboard focus on PC, the card nearest the screen centre on touch screens */
  (function(){
    var NS='http://www.w3.org/2000/svg';
    /* なんでも衛星: orbits with satellites */
    var fn=document.querySelector('.fx-nandemo');
    [[78,'🍙🚀',38],[118,'🐄🍌',56],[160,'🌏🍩🛸',80]].forEach(function(o){var d=document.createElement('div');d.className='orb';d.style.width=d.style.height=o[0]+'vmin';
      var r=document.createElement('div');r.className='rot';r.style.animationDuration=o[2]+'s';
      Array.from(o[1]).forEach(function(e,i,a){var w=document.createElement('div');w.style.cssText='position:absolute;inset:0;transform:rotate('+(i*360/a.length+(o[0]%50))+'deg)';
        var s=document.createElement('span');s.className='sat';s.innerHTML='<i style="animation-duration:'+o[2]+'s">'+e+'</i>';w.appendChild(s);r.appendChild(w)});
      d.appendChild(r);fn.appendChild(d)});
    /* ゾンビ一閃: blood splatters (random blobs + droplets) on the edges, drips under the top ones */
    var fz=document.querySelector('.fx-zombie');
    function splat(css,size,delay,drips){var sv=document.createElementNS(NS,'svg');sv.setAttribute('viewBox','-100 -100 200 200');sv.setAttribute('class','splat');
      sv.style.cssText=css+';width:'+size+'vmin;height:'+size+'vmin;transition-delay:'+delay+'s';
      function c(x,y,r){var e=document.createElementNS(NS,'circle');e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('r',r);e.setAttribute('fill',Math.random()<.5?'#8a0010':'#6e000c');sv.appendChild(e)}
      c(0,0,34);for(var i=0;i<9;i++){var a=Math.random()*6.283,d=22+Math.random()*16;c(Math.cos(a)*d,Math.sin(a)*d,10+Math.random()*12)}
      for(i=0;i<16;i++){a=Math.random()*6.283;d=50+Math.random()*45;c(Math.cos(a)*d,Math.sin(a)*d,1.5+Math.random()*5)}
      fz.appendChild(sv);
      (drips||[]).forEach(function(q){var dr=document.createElement('div');dr.className='drip';dr.style.cssText='left:'+q[0]+';top:'+q[1]+';--h:'+q[2]+'px;animation-delay:'+q[3]+'s';fz.appendChild(dr)})}
    splat('left:-6vmin;top:-7vmin',34,0,[['9vmin','19vmin',90,.4],['15vmin','17vmin',60,2.2]]);
    splat('right:-8vmin;top:-5vmin',40,.08,[['calc(100% - 17vmin)','23vmin',120,1.1]]);
    splat('left:-12vmin;top:42vh',28,.16);splat('right:-10vmin;bottom:8vh',36,.24);splat('left:18vw;bottom:-10vmin',26,.3);
    /* switching */
    var b=document.body,cards=document.querySelectorAll('a.card[data-theme]'),t=null;
    function set(v){clearTimeout(t);if(v)b.setAttribute('data-theme',v);else t=setTimeout(function(){b.removeAttribute('data-theme')},150)}
    if(window.matchMedia&&matchMedia('(hover:hover)').matches){
      Array.prototype.forEach.call(cards,function(c){var v=c.getAttribute('data-theme');
        c.addEventListener('mouseenter',function(){set(v)});c.addEventListener('mouseleave',function(){set(null)});
        c.addEventListener('focus',function(){set(v)});c.addEventListener('blur',function(){set(null)})})}
    else{var cur=null,raf=0;function pick(){raf=0;var mid=innerHeight/2,best=null,bd=1e9;
        Array.prototype.forEach.call(cards,function(c){var r=c.getBoundingClientRect();if(r.bottom<innerHeight*.2||r.top>innerHeight*.8)return;var d=Math.abs((r.top+r.bottom)/2-mid);if(d<bd){bd=d;best=c}});
        var v=best?best.getAttribute('data-theme'):null;if(v!==cur){cur=v;if(v)b.setAttribute('data-theme',v);else b.removeAttribute('data-theme')}}
      addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(pick)},{passive:true});addEventListener('resize',pick);pick()}
  })();
  </script>
