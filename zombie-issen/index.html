 const s=nz(.3),f=AC.createBiquadFilter(),g2=AC.createGain();f.type='lowpass';f.frequency.value=700;ev(g2,t,.005,.28,.5);s.connect(f);f.connect(g2);g2.connect(MG);s.start(t);s.stop(t+.34)}

{const sc=sun.shadow.camera;sc.left=-11;sc.right=11;sc.top=9;sc.bottom=-2;sc.near=.5;sc.far=32;sc.updateProjectionMatrix()}
