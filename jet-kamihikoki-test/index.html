<script>
(function(){
'use strict';
if(!window.THREE){window.__ldFail(false);return}
if(!window.__glok){window.__ldFail(true);return}
var EN=!!window.__EN;function J(ja,en){return EN?en:ja}
var DBG=/[?&]dbg\b/.test(location.search);
var V3=THREE.Vector3;

/* ---------- constants. body frame: +X nose, +Y up, +Z right. metres, kg, seconds ---------- */
var G=9.8, RHO=1.225, HS=1/300;
var PAD=50;                        /* launch pad height. ?pad= overrides it on the test version */
/* Masses, inertia and thrust are all 3x what a real paper plane would be, with the wings left as they are.
   That makes every speed 1.73x higher without changing how it handles: same trim, same glide ratio,
   same turn rates. Raising the launch speed on its own would just make it loop. */
var MP=0.210, PCM=new V3(0.02,0,0);          /* paper: mass and its own centre of mass */
var IPX=6.99e-4, IPY=2.073e-3, IPZ=1.371e-3; /* paper inertia about PCM (roll, yaw, pitch) */
var ME=0.090, TH=2.0, EFUEL=3.0, EMAX=4;     /* one engine: mass, thrust, fuel seconds, how many fit.
   thrust is about 0.7x the weight of a one-engine build, so it climbs instead of looping. Adding engines
   raises that ratio, so a four-engine build will loop unless they are burnt a few at a time. */
var CLA=3.2, ASTALL=0.28, CD0=0.015, ADAMP=0.0045;
/* launch: always the same, so only the build differs. ?v= and ?a= override it on the test version */
var LV=24, LANG=20;
(function(){var q=location.search;
 var mv=q.match(/[?&]v=(\d+(?:\.\d+)?)/);if(mv)LV=clampN(parseFloat(mv[1]),4,90);
 var mp=q.match(/[?&]pad=(\d+(?:\.\d+)?)/);if(mp)PAD=clampN(parseFloat(mp[1]),5,250);
 var ma=q.match(/[?&]a=(-?\d+(?:\.\d+)?)/);if(ma)LANG=clampN(parseFloat(ma[1]),-20,70);
 function clampN(v,a,b){return v<a?a:v>b?b:v}})();
LANG=LANG*Math.PI/180;
var NP=-0.035;                     /* neutral point: the build is stable while the centre of mass sits ahead of this */
var IW=0.09, IE=-0.22;             /* the folded paper holds the wings slightly nose-up and the tail edge turned up, so it trims nose-up instead of just falling */
var QFLEX=900;                     /* fast air flattens those folds again, so the faster it goes the less it wants to climb */
var PANELS=[
 {r:new V3(-0.010,0,-0.055), inc:IW,          A:0.012},   /* left wing */
 {r:new V3(-0.010,0, 0.055), inc:IW,          A:0.012},   /* right wing */
 {r:new V3(-0.135,0, 0),     inc:IE,          A:0.006},   /* turned-up tail edge */
 {r:new V3(-0.100,-0.02,0),  n:new V3(0,0,1), A:0.006}    /* keel */
];

function clamp(v,a,b){return v<a?a:v>b?b:v}
function rnd(s){s=Math.sin(s*12.9898)*43758.5453;return s-Math.floor(s)}

/* ---------- 3x3 matrices as flat arrays (row major) ---------- */
function m3zero(){return [0,0,0,0,0,0,0,0,0]}
function m3point(M,m,rx,ry,rz){var d2=rx*rx+ry*ry+rz*rz;
 M[0]+=m*(d2-rx*rx);M[1]+=m*(-rx*ry);M[2]+=m*(-rx*rz);
 M[3]+=m*(-ry*rx);M[4]+=m*(d2-ry*ry);M[5]+=m*(-ry*rz);
 M[6]+=m*(-rz*rx);M[7]+=m*(-rz*ry);M[8]+=m*(d2-rz*rz);}
function m3inv(m){var a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],g=m[6],h=m[7],i=m[8];
 var A=e*i-f*h,B=f*g-d*i,C=d*h-e*g,det=a*A+b*B+c*C;
 if(Math.abs(det)<1e-14)det=det<0?-1e-14:1e-14;var k=1/det;
 return [A*k,(c*h-b*i)*k,(b*f-c*e)*k, B*k,(a*i-c*g)*k,(c*d-a*f)*k, C*k,(b*g-a*h)*k,(a*e-b*d)*k]}
function m3mul(m,v,o){return o.set(m[0]*v.x+m[1]*v.y+m[2]*v.z, m[3]*v.x+m[4]*v.y+m[5]*v.z, m[6]*v.x+m[7]*v.y+m[8]*v.z)}

/* ---------- scene ---------- */
var cvs=document.getElementById('gl');
var ren=new THREE.WebGLRenderer({canvas:cvs,antialias:true});
ren.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
var scene=new THREE.Scene();
var SKY=0x8fc4ea;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,70,900);
var cam=new THREE.PerspectiveCamera(58,1,0.05,2500);
scene.add(new THREE.HemisphereLight(0xcfe6ff,0x5a7040,0.95));
var sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(-0.4,1,0.5);scene.add(sun);

function resize(){var w=cvs.clientWidth,h=cvs.clientHeight;ren.setSize(w,h,false);cam.aspect=w/Math.max(1,h);cam.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ground, 50 m stripes, trees for a sense of speed */
var grd=new THREE.Mesh(new THREE.PlaneGeometry(6000,1600),new THREE.MeshLambertMaterial({color:0x5d8a44}));
grd.rotation.x=-Math.PI/2;grd.position.set(1400,0,0);scene.add(grd);
(function(){
 var g=new THREE.PlaneGeometry(1.2,110),m=new THREE.MeshLambertMaterial({color:0xe8eedd}),n=56;
 var im=new THREE.InstancedMesh(g,m,n),d=new THREE.Object3D();
 for(var i=0;i<n;i++){d.position.set(i*50,0.03,0);d.rotation.set(-Math.PI/2,0,0);d.updateMatrix();im.setMatrixAt(i,d.matrix)}
 scene.add(im);
 var tg=new THREE.ConeGeometry(1.1,4,6),tm=new THREE.MeshLambertMaterial({color:0x2f6b35}),tn=420;
 var ti=new THREE.InstancedMesh(tg,tm,tn);
 for(var k=0;k<tn;k++){
  var sx=rnd(k*3.1)*2700, sz=(rnd(k*5.7)-0.5)*160, sc=0.7+rnd(k*7.3)*1.1;
  if(Math.abs(sz)<16)sz+=sz<0?-16:16;
  d.position.set(sx,2*sc,sz);d.rotation.set(0,rnd(k)*6.3,0);d.scale.set(sc,sc,sc);d.updateMatrix();ti.setMatrixAt(k,d.matrix)}
 scene.add(ti);
 var pole=new THREE.Mesh(new THREE.CylinderGeometry(PAD*0.005,PAD*0.009,PAD,10),new THREE.MeshLambertMaterial({color:0x8a6a4a}));
 pole.position.set(0,PAD/2,0);scene.add(pole);window.__pole=pole;
})();

/* ---------- the paper plane ---------- */
var NOSE=new V3(0.14,0,0), TAILC=new V3(-0.14,0,0);
var TL=new V3(-0.14,0.014,-0.10), TR=new V3(-0.14,0.014,0.10), KEEL=new V3(-0.14,-0.045,0);
var craft=new THREE.Group();scene.add(craft);
(function(){
 function tri(a,b,c,out){out.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z)}
 var v=[];tri(NOSE,TAILC,TL,v);tri(NOSE,TR,TAILC,v);tri(NOSE,KEEL,TAILC,v);
 var g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.computeVertexNormals();
 var body=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0xf2f4f8,side:THREE.DoubleSide}));
 body.name='paper';craft.add(body);
 var lv=[];[[NOSE,TAILC],[NOSE,TL],[NOSE,TR],[NOSE,KEEL],[TAILC,TL],[TAILC,TR],[TAILC,KEEL]].forEach(function(p){
  lv.push(p[0].x,p[0].y,p[0].z,p[1].x,p[1].y,p[1].z)});
 var lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lv,3));
 craft.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x8b96a8})));
})();
var paperMesh=craft.getObjectByName('paper');

/* centre of mass marker and the lift-centre ring, shown while building */
var cmBall=new THREE.Mesh(new THREE.SphereGeometry(0.014,12,10),new THREE.MeshBasicMaterial({color:0xffffff}));
craft.add(cmBall);
var acRing=new THREE.Mesh(new THREE.TorusGeometry(0.018,0.004,6,16),new THREE.MeshBasicMaterial({color:0x6fe0ff}));
acRing.position.set(NP,0,0);acRing.rotation.y=Math.PI/2;craft.add(acRing);

/* ---------- engines ---------- */
var ENG=[];            /* {pos:V3 body, nrm:V3, grp:Group, fuel:number, on:boolean} */
var ECSS=['#ffa24a','#6fe0ff','#9dff7d','#ff8ad6'], EHEX=[0xffa24a,0x6fe0ff,0x9dff7d,0xff8ad6];
var egeo=new THREE.CylinderGeometry(0.013,0.015,0.05,10);
var ngeo=new THREE.CylinderGeometry(0.011,0.014,0.014,10);
var emat=new THREE.MeshLambertMaterial({color:0x4a5161});
var nmat=new THREE.MeshLambertMaterial({color:0xc06a3a});
var fmat=new THREE.MeshBasicMaterial({color:0xffc24a,transparent:true,opacity:0.9});
function addEngine(pos,nrm){
 if(ENG.length>=EMAX)return;
 var g=new THREE.Group();
 var b=new THREE.Mesh(egeo,emat);b.rotation.z=Math.PI/2;g.add(b);
 var n=new THREE.Mesh(ngeo,nmat.clone());n.rotation.z=Math.PI/2;n.position.x=-0.031;g.add(n);
 var fl=new THREE.Mesh(new THREE.ConeGeometry(0.012,0.07,8),fmat);
 fl.rotation.z=Math.PI/2;fl.position.x=-0.072;fl.visible=false;g.add(fl);
 g.position.copy(pos);
 var e={pos:pos.clone(),nrm:nrm.clone(),grp:g,flame:fl,nz:n,fuel:EFUEL,on:false,btn:null};
 ENG.push(e);craft.add(g);buildInfo();
}
function removeEngine(i){craft.remove(ENG[i].grp);ENG.splice(i,1);buildInfo()}
function clearEngines(){while(ENG.length)removeEngine(0)}
function engineColours(){for(var i=0;i<ENG.length;i++)ENG[i].nz.material.color.setHex(EHEX[i%EHEX.length])}

/* ---------- mass properties ---------- */
var MASS=MP, CM=new V3(), IB=m3zero(), IINV=m3zero();
function massProps(){
 MASS=MP+ME*ENG.length;
 CM.copy(PCM).multiplyScalar(MP);
 for(var i=0;i<ENG.length;i++)CM.addScaledVector(ENG[i].pos,ME);
 CM.multiplyScalar(1/MASS);
 IB=m3zero();IB[0]+=IPX;IB[4]+=IPY;IB[8]+=IPZ;
 m3point(IB,MP,PCM.x-CM.x,PCM.y-CM.y,PCM.z-CM.z);
 for(i=0;i<ENG.length;i++)m3point(IB,ME,ENG[i].pos.x-CM.x,ENG[i].pos.y-CM.y,ENG[i].pos.z-CM.z);
 IINV=m3inv(IB);
 cmBall.position.copy(CM);
}

/* ---------- flight state ---------- */
var POS=new V3(), VEL=new V3(), Q=new THREE.Quaternion(), W=new V3();
var heat=0, scorch=0, far=0, ft=0, mode='title', best=0, alive=true;
try{best=Math.max(0,parseFloat(localStorage.getItem('jk_best'))||0)}catch(e){}
var t1=new V3(),t2=new V3(),t3=new V3(),t4=new V3(),vb=new V3(),rr=new V3(),vp=new V3(),uu=new V3(),ld=new V3(),ff=new V3(),fb=new V3(),tb=new V3(),wd=new V3(),pnv=new V3();
var qc=new THREE.Quaternion(),qw=new THREE.Quaternion(),qd=new THREE.Quaternion();
var lastA=0,lastB=0,flex=1;

function startFlight(){
 massProps();
 POS.set(0,PAD,0);
 VEL.set(Math.cos(LANG)*LV,Math.sin(LANG)*LV,0);
 Q.setFromAxisAngle(new V3(0,0,1),LANG);
 W.set(0,0,0);heat=0;scorch=0;far=0;ft=0;alive=true;
 for(var i=0;i<ENG.length;i++){ENG[i].fuel=EFUEL;ENG[i].on=false;ENG[i].flame.visible=false}
 buildJetButtons();
 craft.position.copy(POS);craft.quaternion.copy(Q);
 cmBall.visible=false;acRing.visible=false;window.__pole.visible=true;
 mode='fly';ovHide();bbox.style.display='none';btip.style.display='none';
 hud.style.display='flex';bars.style.display='block';jets.style.display='block';
}

function step(dt){
 ft+=dt;
 qc.set(-Q.x,-Q.y,-Q.z,Q.w);
 vb.copy(VEL).applyQuaternion(qc);
 flex=1/(1+0.5*RHO*vb.lengthSq()/QFLEX);
 fb.set(0,0,0);tb.set(0,0,0);
 var i,p,V2,Vm,sa,ca,aa,cl,cd,qq,l,pn,ii;
 for(i=0;i<PANELS.length;i++){
  p=PANELS[i];
  pn=p.n;
  if(!pn){ii=p.inc*flex;pnv.set(-Math.sin(ii),Math.cos(ii),0);pn=pnv}
  rr.copy(p.r).sub(CM);
  vp.copy(vb).add(t1.crossVectors(W,rr));
  V2=vp.lengthSq();if(V2<0.02)continue;
  Vm=Math.sqrt(V2);uu.copy(vp).multiplyScalar(1/Vm);

  ca=Math.sqrt(Math.max(0,1-sa*sa));
  aa=Math.abs(Math.asin(sa));
  cl=CLA*sa*ca;
  if(aa>ASTALL){
   var fo=Math.max(0.25,1-(aa-ASTALL)*1.6);
   cl=CLA*Math.sin(ASTALL)*Math.cos(ASTALL)*fo*(sa<0?-1:1);
  }
  cl*=(1-0.35*scorch);
  cd=CD0*(1+0.8*scorch)+2*sa*sa;
  qq=0.5*RHO*V2*p.A;
  ld.copy(pn).addScaledVector(uu,-pn.dot(uu));
  l=ld.length();if(l>1e-6)ld.multiplyScalar(1/l);else ld.set(0,0,0);
  ff.copy(ld).multiplyScalar(qq*cl).addScaledVector(uu,-qq*cd);
  fb.add(ff);tb.add(t2.crossVectors(rr,ff));
  if(i===0){lastA=Math.asin(sa)}
  if(i===3){lastB=Math.asin(sa)}
 }
 var nb=0;
 for(i=0;i<ENG.length;i++){
  var e=ENG[i];
  if(!e.on||e.fuel<=0){e.flame.visible=false;continue}
  e.fuel=Math.max(0,e.fuel-dt);nb++;
  rr.copy(e.pos).sub(CM);
  ff.set(TH,0,0);
  fb.add(ff);tb.add(t2.crossVectors(rr,ff));
  e.flame.visible=true;
  e.flame.scale.set(1,0.75+Math.random()*0.6,1);
 }
 if(nb>0)heat+=dt*nb/2.6;else heat=Math.max(0,heat-dt*0.35);
 scorch=clamp(Math.max(scorch,heat-1),0,1);

 tb.addScaledVector(W,-ADAMP);

 t3.copy(fb).applyQuaternion(Q);t3.y-=MASS*G;
 VEL.addScaledVector(t3,dt/MASS);
 POS.addScaledVector(VEL,dt);

 m3mul(IB,W,t1);t2.crossVectors(W,t1);t4.copy(tb).sub(t2);
 m3mul(IINV,t4,wd);
 W.addScaledVector(wd,dt);
 var wl=W.length();if(wl>45)W.multiplyScalar(45/wl);

 qw.set(W.x,W.y,W.z,0);qd.multiplyQuaternions(Q,qw);
 Q.set(Q.x+0.5*qd.x*dt, Q.y+0.5*qd.y*dt, Q.z+0.5*qd.z*dt, Q.w+0.5*qd.w*dt).normalize();

 var d=Math.sqrt(POS.x*POS.x+POS.z*POS.z);if(d>far)far=d;
 if(POS.y<=0.02){POS.y=0.02;land()}
 else if(ft>120)land();
}

function land(){
 if(mode!=='fly')return;
 mode='over';alive=false;
 for(var i=0;i<ENG.length;i++){ENG[i].on=false;ENG[i].flame.visible=false}
 jets.style.display='none';
 bars.style.display='none';
 var m=Math.floor(far),isNew=m>Math.floor(best);
 if(isNew){best=m;try{localStorage.setItem('jk_best',String(m))}catch(e){}}
 ovShow('<p style="opacity:.8">'+J('ちゃくち','LANDED')+'</p><div id="rec" class="f">'+m+'<small>m</small></div>'+
  (isNew?'<div id="new">'+J('ベスト記録！','NEW BEST!')+'</div>':'<p style="opacity:.7">BEST '+Math.floor(best)+'m</p>')+
  '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'+
  '<button class="btn go" id="again" type="button">'+J('同じ配置でもう一度','Same build again')+'</button>'+
  '<button class="btn" id="redo" type="button">'+J('置き直す','Rebuild')+'</button></div>');
}

/* ---------- build mode: orbit the plane, tap a surface to mount ---------- */
var orbA=-0.9, orbE=0.22, orbR=0.55;
function buildCam(){
 var cy=Math.cos(orbE)*orbR;
 cam.position.set(Math.cos(orbA)*cy, PAD+Math.sin(orbE)*orbR, Math.sin(orbA)*cy);
 cam.up.set(0,1,0);cam.lookAt(0,PAD,0);
}
function enterBuild(){
 mode='build';
 craft.position.set(0,PAD,0);craft.quaternion.identity();
 cmBall.visible=true;acRing.visible=true;window.__pole.visible=false;
 hud.style.display='none';bars.style.display='none';jets.style.display='none';
 bbox.style.display='flex';btip.style.display='block';
 btip.innerHTML=J('ドラッグで回す／機体をタップしてエンジンを付ける<br>エンジンをタップすると外せる',
                  'Drag to turn it. Tap the plane to mount an engine.<br>Tap an engine to take it off.');
 ovHide();massProps();buildInfo();
}
var bbox=document.getElementById('build'),bstat=document.getElementById('bstat'),brow=document.getElementById('brow'),btip=document.getElementById('btip');
function buildInfo(){
 massProps();
 engineColours();
 var stable=CM.x>NP+0.010;
 var side=0;for(var i=0;i<ENG.length;i++)side+=ENG[i].pos.z;
 var sym=Math.abs(side)<0.012;
 bstat.innerHTML='<b>'+J('エンジン','Engines')+' '+ENG.length+' / '+EMAX+'</b>　'+
  '<span class="'+(stable?'ok':'ng')+'">'+(stable?J('安定','stable'):J('不安定','unstable'))+'</span>　'+
  '<span class="'+(sym?'ok':'ng')+'">'+(sym?J('左右つりあい','balanced'):(side>0?J('右に寄り','right-heavy'):J('左に寄り','left-heavy')))+'</span>';
 brow.innerHTML='<button class="btn go" id="golaunch" type="button">'+J('発射','Launch')+'</button>'+
  (ENG.length?'<button class="btn sm" id="clr" type="button">'+J('全部はずす','Clear')+'</button>':'');
}
brow.addEventListener('click',function(e){
 if(e.target.id==='golaunch'){if(!ENG.length&&!confirmNoEngine())return;startFlight()}
 else if(e.target.id==='clr')clearEngines();
});
function confirmNoEngine(){return true}

var ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pickAt(cx,cy){
 var r=cvs.getBoundingClientRect();
 ndc.x=((cx-r.left)/r.width)*2-1;ndc.y=-((cy-r.top)/r.height)*2+1;
 ray.setFromCamera(ndc,cam);
 var eg=[];for(var i=0;i<ENG.length;i++)eg.push(ENG[i].grp);
 var he=ray.intersectObjects(eg,true);
 if(he.length){
  var o=he[0].object;while(o&&o.parent!==craft)o=o.parent;
  for(i=0;i<ENG.length;i++)if(ENG[i].grp===o){removeEngine(i);return}
 }
 var hp=ray.intersectObject(paperMesh,false);
 if(hp.length){
  var pt=craft.worldToLocal(hp[0].point.clone());
  var nl=hp[0].face.normal.clone();
  if(nl.dot(ray.ray.direction)>0)nl.negate();
  pt.addScaledVector(nl,0.017);
  addEngine(pt,nl);
 }
}

/* ---------- input ---------- */
var pdx=0,pdy=0,pmv=0,down=false;
cvs.addEventListener('pointerdown',function(e){
 if(mode!=='build')return;
 down=true;pmv=0;pdx=e.clientX;pdy=e.clientY;
 cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId);e.preventDefault();
});
cvs.addEventListener('pointermove',function(e){
 if(mode!=='build'||!down)return;
 var dx=e.clientX-pdx,dy=e.clientY-pdy;
 pmv+=Math.abs(dx)+Math.abs(dy);
 orbA-=dx*0.009;orbE=clamp(orbE+dy*0.007,-1.2,1.2);
 pdx=e.clientX;pdy=e.clientY;e.preventDefault();
});
function pup(e){
 if(mode==='build'&&down&&pmv<9)pickAt(e.clientX,e.clientY);
 down=false;
}
addEventListener('pointerup',pup);
addEventListener('pointercancel',function(){down=false});

var jets=document.getElementById('jets'),JPW=190,JPH=170;
/* one button per engine, laid out the way the engines sit when seen from behind */
function buildJetButtons(){
 jets.innerHTML='';
 var i,pt=[];
 for(i=0;i<ENG.length;i++)pt.push({
  x:JPW*0.5+clamp(ENG[i].pos.z/0.105,-1,1)*JPW*0.34,
  y:JPH*0.52-clamp(ENG[i].pos.y/0.055,-1,1)*JPH*0.30});
 for(var it=0;it<16;it++){                      /* nudge overlapping buttons apart */
  for(i=0;i<pt.length;i++)for(var k=i+1;k<pt.length;k++){
   var dx=pt[k].x-pt[i].x,dy=pt[k].y-pt[i].y,d=Math.hypot(dx,dy);
   if(d<62){if(d<0.001){dx=1;dy=0;d=1}var pu=(62-d)/2/d;
    pt[i].x-=dx*pu;pt[i].y-=dy*pu;pt[k].x+=dx*pu;pt[k].y+=dy*pu}
  }
  for(i=0;i<pt.length;i++){pt[i].x=clamp(pt[i].x,31,JPW-31);pt[i].y=clamp(pt[i].y,31,JPH-31)}
 }
 for(i=0;i<ENG.length;i++)jets.appendChild(mkBtn(ENG[i],i,pt[i]));
}
function mkBtn(e,i,p){
 var b=document.createElement('button');
 b.type='button';b.className='jb';b.textContent=String(i+1);
 b.style.left=p.x+'px';b.style.top=p.y+'px';
 b.style.borderColor=ECSS[i%ECSS.length];b.style.color=ECSS[i%ECSS.length];
 b.addEventListener('pointerdown',function(ev){
  if(mode==='fly'&&e.fuel>0)e.on=true;
  if(b.setPointerCapture&&ev.pointerId!=null){try{b.setPointerCapture(ev.pointerId)}catch(x){}}
  ev.preventDefault();
 });
 function off(ev){e.on=false;if(ev)ev.preventDefault()}
 b.addEventListener('pointerup',off);
 b.addEventListener('pointercancel',off);
 b.addEventListener('contextmenu',function(ev){ev.preventDefault()});
 e.btn=b;return b;
}
function allBurn(on){for(var i=0;i<ENG.length;i++)if(!on||ENG[i].fuel>0)ENG[i].on=on}
addEventListener('keydown',function(e){
 if(e.code==='Space'){if(mode==='fly')allBurn(true);else if(mode==='build')startFlight();e.preventDefault();return}
 var n='1234'.indexOf(e.key);
 if(n>=0&&mode==='fly'&&ENG[n]&&ENG[n].fuel>0){ENG[n].on=true;e.preventDefault()}
});
addEventListener('keyup',function(e){
 if(e.code==='Space'){allBurn(false);return}
 var n='1234'.indexOf(e.key);if(n>=0&&ENG[n])ENG[n].on=false;
});
addEventListener('blur',function(){allBurn(false)});

/* ---------- overlays ---------- */
var ov=document.getElementById('ov');
function ovHide(){ov.className='f off'}
function ovShow(h){ov.className='f';ov.innerHTML=h}
function ovTitle(){
 mode='title';
 hud.style.display='none';bars.style.display='none';jets.style.display='none';
 bbox.style.display='none';btip.style.display='none';
 cmBall.visible=true;acRing.visible=true;window.__pole.visible=false;
 ovShow('<h1>'+J('ジェット紙飛行機','Jet Paper Plane')+'</h1>'+
  '<p>'+J('紙飛行機の<b>どこにジェットエンジンを付けるか</b>で、飛び方が変わります。重心より下に付ければ機首が上がり、片側に寄せれば曲がる。どこまで飛ばせるか。',
          'Where you <b>mount the jets</b> decides how it flies. Below the centre of mass it pitches up; off to one side it turns. How far can you get?')+'</p>'+
  '<button class="btn go" id="start" type="button">'+J('はじめる','Start')+'</button>'+
  '<p style="opacity:.6;font-size:13px">BEST '+Math.floor(best)+'m</p>');
}
ov.addEventListener('click',function(e){
 if(e.target.id==='start'){enterBuild()}
 else if(e.target.id==='again'){startFlight()}
 else if(e.target.id==='redo'){enterBuild()}
});

/* ---------- hud ---------- */
var hud=document.getElementById('hud'),bars=document.getElementById('bars');
var elD=document.getElementById('dist'),elT=document.getElementById('tele'),elW=document.getElementById('warn');
var fuB=document.querySelector('#fu .bi'),heB=document.querySelector('#he .bi');
document.querySelector('#fu span').textContent=J('ねんりょう','FUEL');
document.querySelector('#he span').textContent=J('こげ','HEAT');
function drawHud(){
 elD.innerHTML=Math.floor(far)+'<small>BEST '+Math.floor(best)+'</small>';
 var sp=VEL.length();
 var tx=J('高度','ALT')+' '+Math.round(POS.y)+'m<br>'+J('速さ','SPD')+' '+Math.round(sp*3.6)+'km/h';
 if(DBG)tx+='<br>a '+(lastA*57.3).toFixed(1)+'&deg; b '+(lastB*57.3).toFixed(1)+'&deg;<br>w '+W.length().toFixed(1)+' flex '+flex.toFixed(2);
 elT.innerHTML=tx;
 var tot=ENG.length*EFUEL,rem=0;
 for(var i=0;i<ENG.length;i++)rem+=ENG[i].fuel;
 fuB.style.width=(tot?rem/tot*100:0)+'%';
 heB.style.width=clamp(heat,0,1)*100+'%';
 for(i=0;i<ENG.length;i++){var b=ENG[i].btn;if(!b)continue;
  b.classList.toggle('on',ENG[i].on&&ENG[i].fuel>0);
  b.classList.toggle('no',ENG[i].fuel<=0)}
 var st=mode==='fly'&&Math.abs(lastA)>ASTALL*1.3;
 elW.textContent=st?J('しっそく！','STALL!'):'';
 elW.style.opacity=st?1:0;
}

/* ---------- camera while flying ---------- */
var camDir=new V3(1,0,0), camPos=new V3(-2.4,PAD+0.9,0), look=new V3();
function flyCam(dt){
 t1.set(VEL.x,0,VEL.z);
 if(t1.lengthSq()>0.5){t1.normalize();camDir.lerp(t1,1-Math.exp(-3*dt));var cl2=camDir.length();if(cl2>1e-4)camDir.multiplyScalar(1/cl2)}
 /* the position follows with no lag at all: easing it would leave the camera metres behind at speed */
 camPos.copy(POS).addScaledVector(camDir,-2.4);camPos.y+=0.95;
 if(camPos.y<0.9)camPos.y=0.9;
 cam.position.copy(camPos);cam.up.set(0,1,0);
 look.copy(POS).addScaledVector(camDir,3);look.y+=0.25;
 cam.lookAt(look);
}

/* ---------- loop ---------- */
var acc=0,last=0;
function frame(now){
 requestAnimationFrame(frame);
 var dt=Math.min(0.1,(now-last)/1000||0);last=now;
 if(mode==='build'||mode==='title'){
  craft.rotation.set(0,0,0);
  if(mode==='title'){orbA+=dt*0.25}
  buildCam();
 }else{
  if(mode==='fly'){
   acc+=dt;var n=0;
   while(acc>=HS&&n<600){step(HS);acc-=HS;n++;if(mode!=='fly')break}
   if(acc>HS*600)acc=0;
  }
  craft.position.copy(POS);craft.quaternion.copy(Q);
  flyCam(dt);
  drawHud();
 }
 ren.render(scene,cam);
}

resize();massProps();ovTitle();
document.getElementById('ld').style.display='none';
requestAnimationFrame(frame);
})();
</script>
</body>
