#bars{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:40vw;max-width:220px;pointer-events:none;text-shadow:0 0 4px #000}
.bar{margin-top:7px;font-size:12px;letter-spacing:.06em}
.bo{height:9px;border:1px solid rgba(255,255,255,.55);border-radius:5px;overflow:hidden;background:rgba(0,0,0,.35);margin-top:2px}

#fu .bi{background:linear-gradient(90deg,#6ff0ff,#2f8dff)}
#he .bi{background:linear-gradient(90deg,#ffd36b,#ff5a2f)}
#jet{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:104px;height:104px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,120,40,.22);color:#fff;font-size:17px;letter-spacing:.08em;display:none;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
#jet.on{background:rgba(255,120,40,.6);box-shadow:0 0 26px rgba(255,140,50,.75)}
#jet.no{opacity:.3}
#warn{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:34px;color:#ff6a4a;text-shadow:0 0 12px #000;pointer-events:none;opacity:0;transition:opacity .1s}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px;box-sizing:border-box;background:rgba(6,10,22,.74);text-align:center}

.btn:active{background:rgba(255,255,255,.26)}

<script>
(function(){/* language: ?lang=ja|en (this visit only) > saved setting (jk_opt.lang) > browser language */
 var q=(location.search.match(/[?&]lang=(ja|en)\b/)||[])[1],L=q;if(!L){try{var o=JSON.parse(localStorage.getItem('jk_opt')||'{}');if(o.lang==='ja'||o.lang==='en')L=o.lang}catch(e){}}
 if(!L)L=/^ja\b/i.test(navigator.language||'ja')?'ja':'en';window.__EN=L==='en';
 if(window.__EN){document.documentElement.lang='en';document.title='Jet Paper Plane (test)';var ld=document.getElementById('ld');if(ld)ld.textContent='Loading…'}
 var c=document.createElement('canvas');try{window.__cvok=!!(c.getContext&&c.getContext('2d'))}catch(e){window.__cvok=false}
 window.__ldFail=function(cv){var l=document.getElementById('ld');if(!l)return;l.style.display='flex';
  l.innerHTML=window.__EN?(cv?'This browser cannot draw on a canvas, so the game cannot run.<br>Please try another browser or device.':'The game failed to load.<br>Check your connection and reload the page.'):(cv?'お使いのブラウザでは描画（canvas）が使えないため、遊べません。<br>別のブラウザや端末でお試しください。':'ゲームの読み込みに失敗しました。<br>通信環境を確かめて、ページを読み込み直してください。')};
 addEventListener('error',function(e){if(e.filename&&e.filename.split('#')[0]===location.href.split('#')[0])window.__ldFail(!window.__cvok)});})();

<script>
(function(){
'use strict';
if(!window.__cvok){window.__ldFail(true);return}
var EN=!!window.__EN;function J(ja,en){return EN?en:ja}
var DBG=/[?&]dbg\b/.test(location.search);

/* ---------- world constants (metres, seconds; y = altitude, 0 = ground) ---------- */
var G=9.8, HS=1/200, H0=18, AS=0.26;   /* gravity, fixed step, launch pad height, stall angle of attack (~15deg) */
var A_LO=8, A_HI=52;                   /* launch angle sweep, degrees */
var PITCH_PX=0.006, PITCH_KEY=2.2;     /* drag: radians per pixel / keyboard: radians per second */
var TH_MAX=1.55;

/* kq = wing area, cl = max lift, cd0 = base drag, k = induced drag, T = thrust, fuel = seconds,
   hc = seconds of continuous burn before the paper scorches, stab = how strongly the nose follows the path,
   trim = the slight nose-up the folded paper keeps, so a hands-off throw still glides */
var TYPES=[
 {id:'glide', nm:['滑空型','Glider'], ds:['よく浮いて、遠くまで粘る','Floats well, glides far'],
  kq:0.070, cl:1.00, cd0:0.040, k:0.060, T:10.5, fuel:2.2, hc:2.0, stab:2.4, trim:0.13, v0:15},
 {id:'dart',  nm:['速度型','Dart'],   ds:['速いけれど、沈むのも速い','Fast, but sinks fast'],
  kq:0.038, cl:0.70, cd0:0.050, k:0.095, T:12.5, fuel:2.4, hc:2.2, stab:3.0, trim:0.08, v0:20},
 {id:'tough', nm:['頑丈型','Tough'],  ds:['熱に強く、長く噴射できる','Takes the heat, burns longer'],
  kq:0.055, cl:0.85, cd0:0.050, k:0.080, T:11.0, fuel:2.9, hc:3.4, stab:2.6, trim:0.11, v0:17}
];

/* ---------- helpers ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v}
function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function rnd(s){s=Math.sin(s*12.9898)*43758.5453;return s-Math.floor(s)}

var cv=document.getElementById('gl'),cx=cv.getContext('2d'),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);

/* ---------- state ---------- */
var P=TYPES[0], mode='title', best=0, S=null, aimT=0, acc=0, last=0;
try{best=Math.max(0,parseFloat(localStorage.getItem('jk_best'))||0)}catch(e){}

function saveBest(){try{localStorage.setItem('jk_best',String(Math.floor(best)))}catch(e){}}

function reset(){
 S={x:0,y:H0,vx:0,vy:0,th:0,fuel:P.fuel,heat:0,scorch:0,jet:false,far:0,t:0,slide:false,
    trail:[],smoke:[],stall:0,alpha:0,cl:0,cd:0,over:null};
}

function launch(deg){
 var a=deg*Math.PI/180;
 S.th=a;S.vx=Math.cos(a)*P.v0;S.vy=Math.sin(a)*P.v0;
 mode='fly';ovHide();jetBtn.style.display='flex';
}

function land(why){
 mode='over';S.over=why;S.jet=false;jetBtn.style.display='none';jetBtn.className='f';
 var d=Math.floor(S.far),nb=d>Math.floor(best);
 if(nb){best=d;saveBest()}
 ovResult(d,nb,why);
}

/* ---------- physics ---------- */
function step(dt){
 S.t+=dt;
 if(S.slide){
  var sp=Math.max(0,Math.abs(S.vx)-5.5*dt);
  S.vx=S.vx<0?-sp:sp;S.vy=0;S.y=0;S.x+=S.vx*dt;
  S.th+=(0-S.th)*Math.min(1,6*dt);
  if(S.x>S.far)S.far=S.x;
  if(sp<1.2)land('stop');
  return;
 }
 var v=Math.hypot(S.vx,S.vy);
 var va=v>0.2?Math.atan2(S.vy,S.vx):S.th;
 /* the nose weathervanes toward the flight path plus the paper's trim; weaker when slow */
 S.th=wrap(S.th+wrap(va+P.trim-S.th)*Math.min(1,P.stab*clamp(v/14,0.15,1.8)*dt));
 if(S.kp)S.th=clamp(S.th+S.kp*PITCH_KEY*dt,-TH_MAX,TH_MAX);

 v=Math.hypot(S.vx,S.vy);
 va=v>0.2?Math.atan2(S.vy,S.vx):S.th;
 var a=wrap(S.th-va),ab=Math.abs(a),sg=a<0?-1:1;
 var clmax=P.cl*(1-0.35*S.scorch), cd0=P.cd0*(1+0.8*S.scorch);
 var cl,stall=0;
 if(ab<=AS){cl=clmax*(a/AS)}
 else{var f=Math.max(0.10,1-(ab-AS)/0.40);cl=clmax*sg*f;stall=1-f}
 var cd=cd0+P.k*cl*cl+0.22*stall;
 var q=P.kq*v*v, L=q*cl, D=q*cd;
 var ux=v>0.2?S.vx/v:Math.cos(S.th), uy=v>0.2?S.vy/v:Math.sin(S.th);
 var ax=-D*ux-L*uy, ay=-D*uy+L*ux-G;
 if(S.jet&&S.fuel>0){ax+=P.T*Math.cos(S.th);ay+=P.T*Math.sin(S.th)}
 S.alpha=a;S.cl=cl;S.cd=cd;S.stall=stall;

 S.vx+=ax*dt;S.vy+=ay*dt;
 S.x+=S.vx*dt;S.y+=S.vy*dt;
 if(S.x>S.far)S.far=S.x;

 /* fuel burns, heat builds while burning and cools while gliding; a scorch never heals */
 if(S.jet&&S.fuel>0){
  S.fuel=Math.max(0,S.fuel-dt);S.heat+=dt/P.hc;
  if(S.fuel<=0)S.jet=false;
  if(S.t-(S.smT||0)>0.035){S.smT=S.t;S.smoke.push({x:S.x,y:S.y,t:0})}
 }else{S.heat=Math.max(0,S.heat-dt*0.3)}
 S.scorch=clamp(Math.max(S.scorch,S.heat-1),0,1);

 /* trail of the flight path */
 if(S.t-(S.trT||0)>0.05){S.trT=S.t;S.trail.push({x:S.x,y:S.y});if(S.trail.length>420)S.trail.shift()}
 for(var i=S.smoke.length-1;i>=0;i--){S.smoke[i].t+=dt;if(S.smoke[i].t>1.4)S.smoke.splice(i,1)}

 if(S.y<=0){
  S.y=0;
  if(S.vy<-7||Math.abs(wrap(S.th))>0.9){S.vx*=0.2;land('crash')}
  else{S.vy=0;S.slide=true;S.jet=false}
 }
 if(S.t>90)land('stop');
}

/* ---------- drawing ---------- */
function lerp(a,b,t){return a+(b-a)*t}
function sky(top){
 var hi=clamp(top/420,0,1);
 var g=cx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'rgb('+Math.round(lerp(126,8,hi))+','+Math.round(lerp(200,18,hi))+','+Math.round(lerp(240,54,hi))+')');
 g.addColorStop(1,'rgb('+Math.round(lerp(207,40,hi))+','+Math.round(lerp(233,80,hi))+','+Math.round(lerp(255,140,hi))+')');
 cx.fillStyle=g;cx.fillRect(0,0,W,H);
}
function draw(){
 /* camera: plane sits 32% from the left; zoom out as it climbs */
 var vh=clamp(S.y*1.7+90,90,360), s=H/vh;
 /* the plane sits 40% down the screen, but the green band never takes more than the bottom 12% */
 var camx=S.x-W*0.32/s, camy=Math.max(S.y*s+H*0.40,H*0.88)/s;
 function sx(x){return (x-camx)*s}
 function sy(y){return (camy-y)*s}

 sky(camy);

 /* clouds: two parallax layers */
 for(var l=0;l<2;l++){
  var px=l?0.55:1, al=l?0.30:0.5, rs=l?1.7:1;
  cx.fillStyle='rgba(255,255,255,'+al+')';
  var x0=camx*px, i0=Math.floor((x0-120)/160), i1=Math.ceil((x0+W/s+120)/160);
  for(var i=i0;i<=i1;i++){
   var seed=i*7.13+l*31.7;
   var cxw=i*160+rnd(seed)*120, cyw=40+rnd(seed+1)*330, r=(13+rnd(seed+2)*16)*rs;
   var X=(cxw-x0)*s, Y=sy(cyw);
   if(X<-200||X>W+200||Y<-200||Y>H+200)continue;
   cx.beginPath();
   cx.arc(X,Y,r*s,0,6.3);cx.arc(X+r*s*0.9,Y+r*s*0.2,r*s*0.7,0,6.3);cx.arc(X-r*s*0.9,Y+r*s*0.15,r*s*0.65,0,6.3);
   cx.fill();
  }
 }

 /* ground */
 var gy=sy(0);
 if(gy<H+2){
  cx.fillStyle='#4e7a3a';cx.fillRect(0,gy,W,H-gy+2);
  cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(0,gy,W,Math.max(2,2*s*0.2)+2);
  /* distance markers every 50 m */
  var m0=Math.floor(camx/50)*50, m1=camx+W/s+50;
  cx.textAlign='center';cx.font='600 12px system-ui,sans-serif';
  for(var m=m0;m<=m1;m+=50){
   if(m<0)continue;
   var X=sx(m);
   cx.fillStyle='rgba(255,255,255,.75)';cx.fillRect(X-1,gy,2,m%100?7:13);
   if(m%100===0&&m>0){cx.fillStyle='rgba(255,255,255,.9)';cx.fillText(m+'m',X,gy+27)}
  }
 }

 /* launch pad */
 var pxp=sx(0);
 if(pxp>-60&&pxp<W+60){
  cx.fillStyle='#8a6a4a';cx.fillRect(pxp-5*s*0.2-3,sy(H0),6+s*0.4,Math.max(0,gy-sy(H0)));
  cx.fillStyle='#b9936b';cx.fillRect(pxp-16,sy(H0)-5,34,6);
 }

 /* flight path trail */
 if(S.trail.length>1){
  cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=2;cx.beginPath();
  for(var t=0;t<S.trail.length;t++){var p=S.trail[t];t?cx.lineTo(sx(p.x),sy(p.y)):cx.moveTo(sx(p.x),sy(p.y))}
  cx.stroke();
 }
 /* jet smoke */
 for(var k=0;k<S.smoke.length;k++){
  var sm=S.smoke[k],a2=(1-sm.t/1.4)*0.5;
  cx.fillStyle='rgba(225,230,240,'+a2.toFixed(3)+')';
  cx.beginPath();cx.arc(sx(sm.x),sy(sm.y),4+sm.t*16,0,6.3);cx.fill();
 }

 plane(sx(S.x),sy(S.y),S.th);
 hud();
}

function plane(X,Y,th){
 var v=Math.hypot(S.vx,S.vy);
 cx.save();cx.translate(X,Y);cx.rotate(-th);
 /* speed streak */
 if(v>6&&mode==='fly'){
  var va=Math.atan2(S.vy,S.vx);
  cx.save();cx.rotate(th-va);
  var g=cx.createLinearGradient(-10,0,-10-v*1.5,0);
  g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
  cx.strokeStyle=g;cx.lineWidth=2.5;cx.beginPath();cx.moveTo(-10,0);cx.lineTo(-10-v*1.5,0);cx.stroke();
  cx.restore();
 }
 /* jet flame */
 if(S.jet&&S.fuel>0){
  var fl=16+Math.random()*16;
  cx.fillStyle='rgba(255,170,60,.9)';
  cx.beginPath();cx.moveTo(-8,-4);cx.lineTo(-8,4);cx.lineTo(-8-fl,0);cx.closePath();cx.fill();
  cx.fillStyle='rgba(255,255,220,.95)';
  cx.beginPath();cx.moveTo(-8,-2);cx.lineTo(-8,2);cx.lineTo(-8-fl*0.5,0);cx.closePath();cx.fill();
 }
 /* paper: upper wing, lower wing, fold line */
 var sc=clamp(1-S.scorch*0.0,1,1);
 var up='rgb('+Math.round(255-S.scorch*90)+','+Math.round(255-S.scorch*120)+','+Math.round(255-S.scorch*150)+')';
 var lo='rgb('+Math.round(223-S.scorch*80)+','+Math.round(230-S.scorch*110)+','+Math.round(242-S.scorch*140)+')';
 cx.beginPath();cx.moveTo(19,0);cx.lineTo(-15,-9);cx.lineTo(-8,0);cx.closePath();cx.fillStyle=up;cx.fill();
 cx.beginPath();cx.moveTo(19,0);cx.lineTo(-15,9);cx.lineTo(-8,0);cx.closePath();cx.fillStyle=lo;cx.fill();
 cx.strokeStyle='rgba(120,135,160,.9)';cx.lineWidth=1;
 cx.beginPath();cx.moveTo(19,0);cx.lineTo(-8,0);cx.stroke();
 /* engine */
 cx.fillStyle='#39414f';cx.fillRect(-7,-2.6,10,5.2);
 cx.fillStyle='#8f9aab';cx.fillRect(1,-2.6,2,5.2);
 cx.restore();
 void sc;
}

var elD=document.getElementById('dist'),elT=document.getElementById('tele'),elW=document.getElementById('warn');
var fuB=document.querySelector('#fu .bi'),heB=document.querySelector('#he .bi');
var fuL=document.querySelector('#fu span'),heL=document.querySelector('#he span');
fuL.textContent=J('ねんりょう','FUEL');heL.textContent=J('こげ','HEAT');
function hud(){
 elD.innerHTML=Math.floor(S.far)+'<small>BEST '+Math.floor(best)+'</small>';
 var v=Math.hypot(S.vx,S.vy);
 var tx=J('高度','ALT')+' '+Math.round(S.y)+'m<br>'+J('速さ','SPD')+' '+Math.round(v*3.6)+'km/h';
 if(DBG)tx+='<br>a '+(S.alpha*57.3).toFixed(1)+'&deg; cl '+S.cl.toFixed(2)+' cd '+S.cd.toFixed(3);
 elT.innerHTML=tx;
 fuB.style.width=(S.fuel/P.fuel*100)+'%';
 heB.style.width=clamp(S.heat/1,0,1)*100+'%';
 var st=mode==='fly'&&!S.slide&&S.stall>0.35;
 elW.textContent=st?J('しっそく！','STALL!'):'';
 elW.style.opacity=st?1:0;
}

/* ---------- overlay screens ---------- */
var ov=document.getElementById('ov'),jetBtn=document.getElementById('jet');
jetBtn.textContent=J('ふんしゃ','BURN');
function ovHide(){ov.className='f off'}
function ovShow(html){ov.className='f';ov.innerHTML=html}

function ovTitle(){
 mode='title';jetBtn.style.display='none';
 var cards=TYPES.map(function(t,i){
  return '<div class="card" data-i="'+i+'"><b>'+t.nm[EN?1:0]+'</b><span>'+t.ds[EN?1:0]+'</span>'+
   '<i>'+J('ねんりょう','fuel')+' '+t.fuel.toFixed(1)+'s / '+J('こげにくさ','heat')+' '+t.hc.toFixed(1)+'s</i></div>';
 }).join('');
 ovShow('<h1>'+J('ジェット紙飛行機','Jet Paper Plane')+'</h1>'+
  '<p>'+J('なぞって機首を上下。ボタンを押している間だけ噴射。どこまで飛ばせるか。',
          'Drag to pitch the nose. Hold the button to burn. How far can you go?')+'</p>'+
  '<p style="opacity:.65">'+J('折り方をえらぶ','Pick a fold')+'</p><div class="cards">'+cards+'</div>'+
  '<p style="opacity:.6;font-size:13px">BEST '+Math.floor(best)+'m</p>');
}

function ovResult(d,nb,why){
 var ttl=why==='crash'?J('ついらく','CRASHED'):J('ちゃくち','LANDED');
 ovShow('<p style="opacity:.8">'+ttl+'</p><div id="rec" class="f">'+d+'<small>m</small></div>'+
  (nb?'<div id="new">'+J('ベスト記録！','NEW BEST!')+'</div>':'<p style="opacity:.7">BEST '+Math.floor(best)+'m</p>')+
  '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'+
  '<button class="btn" id="again" type="button">'+J('もういちど','Again')+'</button>'+
  '<button class="btn" id="back" type="button">'+J('折り方をかえる','Change fold')+'</button></div>');
}

ov.addEventListener('click',function(e){
 var c=e.target.closest?e.target.closest('.card'):null;
 if(c){P=TYPES[+c.getAttribute('data-i')];reset();mode='aim';aimT=0;ovHide();return}
 if(e.target.id==='again'){reset();mode='aim';aimT=0;ovHide();return}
 if(e.target.id==='back'){ovTitle();return}
});

/* ---------- input ---------- */
var dragY=null;
function pd(e){
 if(mode==='aim'){launch(aimAngle());e.preventDefault();return}
 if(mode==='fly'){dragY=e.clientY;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);e.preventDefault()}
}
function pm(e){
 if(mode==='fly'&&dragY!==null&&!S.slide){
  S.th=clamp(S.th-(e.clientY-dragY)*PITCH_PX,-TH_MAX,TH_MAX);
  dragY=e.clientY;e.preventDefault();
 }
}
function pu(){dragY=null}
cv.addEventListener('pointerdown',pd);cv.addEventListener('pointermove',pm);
addEventListener('pointerup',pu);addEventListener('pointercancel',pu);

function jetOn(e){if(mode==='fly'&&S.fuel>0){S.jet=true;jetBtn.className='f on'}e&&e.preventDefault()}
function jetOff(e){if(S){S.jet=false}jetBtn.className='f';e&&e.preventDefault()}
jetBtn.addEventListener('pointerdown',jetOn);
jetBtn.addEventListener('pointerup',jetOff);
jetBtn.addEventListener('pointerleave',jetOff);
jetBtn.addEventListener('pointercancel',jetOff);
jetBtn.addEventListener('contextmenu',function(e){e.preventDefault()});

addEventListener('keydown',function(e){
 if(e.key==='ArrowUp'){S&&(S.kp=1);e.preventDefault()}
 else if(e.key==='ArrowDown'){S&&(S.kp=-1);e.preventDefault()}
 else if(e.code==='Space'){if(mode==='aim')launch(aimAngle());else jetOn();e.preventDefault()}
});
addEventListener('keyup',function(e){
 if(e.key==='ArrowUp'||e.key==='ArrowDown'){S&&(S.kp=0)}
 else if(e.code==='Space'){jetOff()}
});
addEventListener('blur',function(){jetOff();S&&(S.kp=0)});

/* ---------- aim ---------- */
function aimAngle(){var p=(aimT*0.55)%2;if(p>1)p=2-p;return A_LO+(A_HI-A_LO)*p}
function drawAim(dt){
 aimT+=dt;
 var vh=clamp(H0*1.7+90,90,360),s=H/vh,camx=-W*0.32/s,camy=Math.max(H0*s+H*0.40,H*0.88)/s;
 S.x=0;S.y=H0;S.vx=0;S.vy=0;S.th=aimAngle()*Math.PI/180;
 draw();
 /* angle gauge */
 var X=(0-camx)*s, Y=(camy-H0)*s, a=aimAngle()*Math.PI/180;
 cx.save();cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=2;cx.setLineDash([5,5]);
 cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X+Math.cos(a)*150,Y-Math.sin(a)*150);cx.stroke();cx.restore();
 cx.save();cx.textAlign='center';cx.font='600 15px system-ui,sans-serif';cx.fillStyle='#fff';
 cx.shadowColor='#000';cx.shadowBlur=6;
 cx.fillText(Math.round(aimAngle())+'°',X+Math.cos(a)*172,Y-Math.sin(a)*172+5);
 cx.fillText(J('タップで発射','Tap to launch'),W/2,H*0.80);
 cx.restore();
}

/* ---------- loop ---------- */
function frame(now){
 requestAnimationFrame(frame);
 if(!W||!H)resize();
 var dt=Math.min(0.1,(now-last)/1000||0);last=now;
 if(mode==='title'){sky(120);return}
 if(mode==='aim'){drawAim(dt);hud();return}
 if(mode==='fly'){
  acc+=dt;var n=0;
  while(acc>=HS&&n<400){step(HS);acc-=HS;n++;if(mode!=='fly')break}
  if(acc>HS*400)acc=0;
 }
 draw();
}

resize();reset();ovTitle();
document.getElementById('ld').style.display='none';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
